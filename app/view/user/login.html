{extend name="layout/base" /}

{block name="title"}用户登录 - 小说阅读网{/block}

{block name="css"}
<link rel="stylesheet" href="/static/css/auth.css">
{/block}

{block name="content"}
<section class="auth-section">
    <div class="container">
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="auth-header">
                    <h2 class="auth-title">用户登录</h2>
                    <p class="auth-subtitle">欢迎回到小说阅读网</p>
                </div>
                
                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label class="form-label">用户名</label>
                        <input type="text" name="username" class="form-input" placeholder="请输入用户名" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <input type="password" name="password" class="form-input" placeholder="请输入密码" required>
                    </div>
                    
                    <div class="form-group form-actions">
                        <label class="form-check">
                            <input type="checkbox" name="remember" value="1">
                            <span>记住我</span>
                        </label>
                        <a href="javascript:;" class="forgot-link">忘记密码？</a>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block btn-lg">登录</button>
                </form>
                
                <div class="auth-footer">
                    <p>还没有账号？<a href="/user/register" class="auth-link">立即注册</a></p>
                </div>
            </div>
        </div>
    </div>
</section>
{/block}

{block name="js"}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const loginForm = document.getElementById('loginForm');
    
    loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = new FormData(loginForm);
        
        fetch('/user/login', {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => response.json())
        .then(result => {
            if (result.code === 200) {
                alert(result.msg);
                if (result.url) {
                    window.location.href = result.url;
                } else {
                    window.location.reload();
                }
            } else {
                alert(result.msg);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('登录失败，请稍后重试');
        });
    });
});
</script>
{/block}
