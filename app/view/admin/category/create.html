{extend name="admin/layout/base" /}

{block name="title"}添加分类 - 管理后台{/block}
{block name="page_title"}添加分类{/block}

{block name="content"}
<div class="form-card">
    <form id="categoryForm" class="admin-form">
        <div class="form-row">
            <div class="form-col col-6">
                <div class="form-group">
                    <label class="form-label">分类名称 <span class="required">*</span></label>
                    <input type="text" name="name" class="form-input" placeholder="请输入分类名称" required>
                </div>
            </div>
            <div class="form-col col-6">
                <div class="form-group">
                    <label class="form-label">排序</label>
                    <input type="number" name="sort" class="form-input" value="{$maxSort}" min="1">
                </div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-col col-6">
                <div class="form-group">
                    <label class="form-label">分类图标（emoji）</label>
                    <input type="text" name="icon" class="form-input" placeholder="例如：✨ 📚 ❤️">
                    <p class="form-hint">输入 emoji 表情作为分类图标</p>
                </div>
            </div>
            <div class="form-col col-6">
                <div class="form-group">
                    <label class="form-label">状态</label>
                    <select name="status" class="form-select">
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="form-actions">
            <a href="/admin/category/index" class="btn btn-outline btn-lg">取消</a>
            <button type="submit" class="btn btn-primary btn-lg">保存分类</button>
        </div>
    </form>
</div>
{/block}

{block name="js"}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const categoryForm = document.getElementById('categoryForm');
    
    categoryForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = new FormData(this);
        
        fetch('/admin/category/create', {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => response.json())
        .then(result => {
            alert(result.msg);
            if (result.code === 200 && result.url) {
                window.location.href = result.url;
            }
        });
    });
});
</script>
{/block}
