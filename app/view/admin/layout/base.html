<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{block name="title"}管理后台 - 小说阅读网{/block}</title>
    <link rel="stylesheet" href="/static/admin/css/admin.css">
    {block name="css"}{/block}
</head>
<body>
    <!-- 侧边栏 -->
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="sidebar-header">
            <div class="logo">
                <span class="logo-icon">📚</span>
                <span class="logo-text">小说阅读网</span>
            </div>
            <span class="sidebar-tag">管理后台</span>
        </div>
        
        <nav class="sidebar-nav">
            <ul class="nav-list">
                <li class="nav-item {if $Request.controller == 'Index'}active{/if}">
                    <a href="/admin/index" class="nav-link">
                        <span class="nav-icon">📊</span>
                        <span class="nav-text">仪表盘</span>
                    </a>
                </li>
                <li class="nav-item {if in_array($Request.controller, ['Novel', 'Chapter'])}active{/if}">
                    <a href="javascript:;" class="nav-link nav-toggle">
                        <span class="nav-icon">📚</span>
                        <span class="nav-text">书籍管理</span>
                        <span class="nav-arrow">▼</span>
                    </a>
                    <ul class="sub-menu">
                        <li><a href="/admin/novel/index">小说列表</a></li>
                        <li><a href="/admin/novel/create">添加小说</a></li>
                        <li><a href="/admin/category/index">分类管理</a></li>
                    </ul>
                </li>
                <li class="nav-item {if $Request.controller == 'User'}active{/if}">
                    <a href="/admin/user/index" class="nav-link">
                        <span class="nav-icon">👥</span>
                        <span class="nav-text">用户管理</span>
                    </a>
                </li>
                <li class="nav-item {if $Request.controller == 'Post'}active{/if}">
                    <a href="javascript:;" class="nav-link nav-toggle">
                        <span class="nav-icon">💬</span>
                        <span class="nav-text">交流管理</span>
                        <span class="nav-arrow">▼</span>
                    </a>
                    <ul class="sub-menu">
                        <li><a href="/admin/post/index">帖子管理</a></li>
                        <li><a href="/admin/post/comments">评论管理</a></li>
                    </ul>
                </li>
            </ul>
        </nav>
        
        <div class="sidebar-footer">
            <button class="toggle-sidebar" id="toggleSidebar" title="收起/展开">
                <span>◀</span>
            </button>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="admin-main">
        <!-- 顶部导航 -->
        <header class="admin-header">
            <div class="header-left">
                <button class="mobile-menu-toggle" id="mobileMenuToggle">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <h1 class="page-title">{block name="page_title"}仪表盘{/block}</h1>
            </div>
            <div class="header-right">
                <div class="admin-info">
                    <span class="admin-avatar">👤</span>
                    <span class="admin-name">{$admin.nickname}</span>
                    <span class="admin-role">{$admin.role == 2 ? '超级管理员' : '管理员'}</span>
                </div>
                <a href="/admin/login/logout" class="logout-btn" title="退出登录">
                    <span>🚪</span>
                </a>
            </div>
        </header>

        <!-- 内容区 -->
        <div class="admin-content">
            {block name="content"}{/block}
        </div>
    </main>

    <!-- 遮罩层 -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <script src="/static/admin/js/admin.js"></script>
    {block name="js"}{/block}
</body>
</html>
