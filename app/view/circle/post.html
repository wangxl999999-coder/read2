{extend name="layout/base" /}

{block name="title"}发布帖子 - 书友圈 - 小说阅读网{/block}

{block name="css"}
<link rel="stylesheet" href="/static/css/circle.css">
{/block}

{block name="content"}
<section class="post-section">
    <div class="container">
        <div class="post-wrapper">
            <div class="post-header">
                <a href="/circle" class="back-link">← 返回书友圈</a>
                <h1 class="page-title">发布新帖子</h1>
            </div>

            <form id="postForm" class="post-form">
                <div class="form-group">
                    <label class="form-label">选择关联小说（可选）</label>
                    <select name="novel_id" class="form-select">
                        <option value="">不关联小说</option>
                        {volist name="novels" id="novel"}
                        <option value="{$novel.id}">{$novel.title}</option>
                        {/volist}
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">帖子标题 <span class="required">*</span></label>
                    <input type="text" name="title" class="form-input" placeholder="请输入帖子标题（1-100字）" maxlength="100" required>
                    <p class="form-hint">请输入一个吸引人的标题</p>
                </div>

                <div class="form-group">
                    <label class="form-label">帖子内容 <span class="required">*</span></label>
                    <textarea name="content" class="form-textarea" placeholder="分享你的阅读心得、推荐好书、与书友交流..." rows="12" required></textarea>
                    <p class="form-hint">
                        <span id="contentCount">0</span>/10000 字
                    </p>
                </div>

                <div class="form-group">
                    <label class="form-label">添加图片（可选）</label>
                    <div class="image-upload-area">
                        <div class="upload-placeholder" id="uploadPlaceholder">
                            <span class="upload-icon">📷</span>
                            <p>点击或拖拽图片到此处上传</p>
                            <p class="upload-hint">支持 JPG、PNG、GIF，单张不超过 5MB</p>
                        </div>
                        <div class="image-preview-list" id="imagePreviewList">
                            <!-- 图片预览将显示在这里 -->
                        </div>
                    </div>
                    <input type="file" id="imageInput" accept="image/*" multiple style="display: none;">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-outline" onclick="history.back()">取消</button>
                    <button type="submit" class="btn btn-primary btn-lg">发布帖子</button>
                </div>
            </form>
        </div>
    </div>
</section>
{/block}

{block name="js"}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const contentTextarea = document.querySelector('textarea[name="content"]');
    const contentCount = document.getElementById('contentCount');
    const postForm = document.getElementById('postForm');
    const imageInput = document.getElementById('imageInput');
    const uploadPlaceholder = document.getElementById('uploadPlaceholder');
    const imagePreviewList = document.getElementById('imagePreviewList');

    contentTextarea.addEventListener('input', function() {
        contentCount.textContent = this.value.length;
    });

    uploadPlaceholder.addEventListener('click', function() {
        imageInput.click();
    });

    imageInput.addEventListener('change', function(e) {
        handleImages(e.target.files);
    });

    function handleImages(files) {
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            if (!file.type.startsWith('image/')) {
                alert('请选择图片文件');
                continue;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = createImagePreview(e.target.result, file.name);
                imagePreviewList.appendChild(preview);
            };
            reader.readAsDataURL(file);
        }
    }

    function createImagePreview(src, name) {
        const div = document.createElement('div');
        div.className = 'image-preview-item';
        div.innerHTML = `
            <img src="${src}" alt="${name}">
            <button type="button" class="remove-image" data-src="${src}">×</button>
        `;

        div.querySelector('.remove-image').addEventListener('click', function() {
            div.remove();
        });

        return div;
    }

    uploadPlaceholder.addEventListener('dragover', function(e) {
        e.preventDefault();
        this.classList.add('drag-over');
    });

    uploadPlaceholder.addEventListener('dragleave', function(e) {
        e.preventDefault();
        this.classList.remove('drag-over');
    });

    uploadPlaceholder.addEventListener('drop', function(e) {
        e.preventDefault();
        this.classList.remove('drag-over');
        handleImages(e.dataTransfer.files);
    });

    postForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const formData = new FormData(this);

        fetch('/circle/post', {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => response.json())
        .then(result => {
            alert(result.msg);
            if (result.code === 200 && result.url) {
                window.location.href = result.url;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('发布失败，请稍后重试');
        });
    });
});
</script>
{/block}
